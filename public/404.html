<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Forecasting &amp; Planning</title>
  <script>
    // Single-page app redirect for GitHub Pages.
    // Encodes the full path/query/hash into a query parameter so GitHub Pages
    // serves index.html, which then restores the original URL via history API.
    var segmentCount = 1; // segments in the repo base path: /ipf-clean-up/ = 1
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
